name: Auto Post Ramadhan Countdown Direct

on:
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di tab Actions
  schedule:
    # Contoh jadwal otomatis jam 09:00 WIB (02:00 UTC)
    - cron: '0 2 * * *'

jobs:
  run-countdown-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ensure Playwright Browsers are Installed
      run: |
        python -m playwright install chromium --with-deps

    - name: Jalankan Script Bot Countdown
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        POST_MODE: 'countdown' # Kunci saklar ke mode hitung mundur Ramadhan
      run: |
        python main.py
